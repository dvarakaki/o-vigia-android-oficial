name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Endereço da API (ms-o-vigia) embutido no APK. Sem ele o app compila e
      # roda igual, só que sem conta, amigos e trocas.
      # Cadastre em Settings → Secrets and variables → Actions:
      #   OVIGIA_API_URL  (ex.: https://api.exemplo.com/)
      - name: Configura endereço da API
        env:
          OVIGIA_API_URL: ${{ secrets.OVIGIA_API_URL }}
        if: env.OVIGIA_API_URL != ''
        run: echo "OVIGIA_API_URL=$OVIGIA_API_URL" >> local.properties

      # Sem o secret cadastrado, o APK de release sai sem chave (só funciona com
      # cache) e os testes seguem normalmente, pois não usam rede.
      # Cadastre em Settings → Secrets and variables → Actions:
      #   COMIC_VINE_API_KEY  (chave gratuita de https://comicvine.gamespot.com/api/)
      - name: Configura chave da Comic Vine
        env:
          COMIC_VINE_API_KEY: ${{ secrets.COMIC_VINE_API_KEY }}
        if: env.COMIC_VINE_API_KEY != ''
        run: echo "COMIC_VINE_API_KEY=$COMIC_VINE_API_KEY" >> local.properties

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # Sem secrets configurados o passo é pulado e o APK sai unsigned.
      # Cadastre em Settings → Secrets and variables → Actions:
      #   OVIGIA_KEYSTORE_BASE64  (base64 do arquivo .jks — `base64 keystore.jks`)
      #   OVIGIA_STOREPASSWORD
      #   OVIGIA_KEYALIAS
      #   OVIGIA_KEYPASSWORD
      - name: Decodifica keystore de release
        env:
          OVIGIA_KEYSTORE_BASE64: ${{ secrets.OVIGIA_KEYSTORE_BASE64 }}
        if: env.OVIGIA_KEYSTORE_BASE64 != ''
        run: |
          echo "$OVIGIA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "OVIGIA_STOREFILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
          echo "OVIGIA_STOREPASSWORD=${{ secrets.OVIGIA_STOREPASSWORD }}" >> "$GITHUB_ENV"
          echo "OVIGIA_KEYALIAS=${{ secrets.OVIGIA_KEYALIAS }}" >> "$GITHUB_ENV"
          echo "OVIGIA_KEYPASSWORD=${{ secrets.OVIGIA_KEYPASSWORD }}" >> "$GITHUB_ENV"

      - name: Build de release (R8)
        run: ./gradlew assembleRelease

      - name: APK de release
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  # Em push de tag v*, publica o APK do job "build" numa GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          name: oVigia ${{ github.ref_name }}
          files: apk/*.apk
          generate_release_notes: true
